<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="照做就行的减脂打卡：今日日程、体重曲线、训练动作、云端同步">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>减脂打卡</title>
<style>
:root{
 --teal:#0f766e;--teal2:#0d9488;--teal3:#14b8a6;--mint:#5eead4;--soft:#ccfbf1;
 --bg:#eef3f2;--card:#ffffff;--ink:#0b1220;--sub:#5b6b7a;--faint:#93a3b1;--line:#e5ecef;
 --amber:#f59e0b;--red:#e11d48;--green:#16a34a;
 --sh:0 2px 10px rgba(4,60,50,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","MiSans","HarmonyOS Sans","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;overscroll-behavior-y:none}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
/* ---------- 顶部 ---------- */
.top{background:linear-gradient(140deg,#0d5f58 0%,#0f766e 45%,#115e59 100%);color:#fff;border-radius:0 0 26px 26px;padding:calc(16px + env(safe-area-inset-top)) 20px 20px;margin:0 -14px 16px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(94,234,212,.14);top:-90px;right:-60px}
.top::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-70px;left:-40px}
.top .d0{font-size:12.5px;opacity:.72;letter-spacing:.05em}
.top .d1{font-size:24px;font-weight:800;margin:2px 0 3px;letter-spacing:.01em}
.top .d2{font-size:13px;opacity:.8}
.ring{position:absolute;right:18px;top:calc(16px + env(safe-area-inset-top));width:76px;height:76px;z-index:2}
.ring .c{font-size:15px;font-weight:800;fill:#fff}
.ring .l{font-size:8.5px;fill:rgba(255,255,255,.75)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.pbar{height:7px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:14px;overflow:hidden;position:relative;z-index:2}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5eead4,#99f6e4);border-radius:99px;transition:width .6s}
.pbar-t{font-size:12px;opacity:.85;margin-top:6px;position:relative;z-index:2}
/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.card h3 .r{font-size:11.5px;color:var(--faint);font-weight:500}
.h2s{font-size:14px;font-weight:800;margin:18px 0 8px;color:var(--ink)}
.now{display:flex;align-items:center;gap:9px;background:linear-gradient(120deg,#f0fdfa,#e8fbf6);border:1.5px solid #99f6e4;border-radius:16px;padding:11px 14px;font-size:13.5px;color:#0f5f56;font-weight:600;margin-bottom:13px}
.now .pulse{width:9px;height:9px;border-radius:50%;background:#10b981;flex:none;animation:pu 1.6s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
/* ---------- 时间轴 ---------- */
.tl{position:relative}
.tln{display:flex;gap:10px;position:relative;padding-bottom:10px}
.tln .tm{width:48px;flex:none;text-align:right;font-size:11.5px;font-weight:700;color:var(--faint);padding-top:15px;font-variant-numeric:tabular-nums}
.tln .rail{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}
.tln .dot{width:13px;height:13px;border-radius:50%;background:#cbd5e1;border:3px solid #e2e8f0;flex:none;margin-top:16px;z-index:1}
.tln .line{width:2.5px;flex:1;background:var(--line);border-radius:2px;margin-top:2px}
.tln:last-child .line{display:none}
.tln .body{flex:1;min-width:0;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:2px}
.btn.sm{padding:8px 11px;font-size:12px;flex:none;border-radius:11px}
.wrow input{flex:1;min-width:0;width:auto}
.tln.done .body{opacity:.62}
.tln.done .dot{background:var(--green);border-color:#d1fae5}
.tln.cur .dot{background:var(--teal3);border-color:var(--soft);box-shadow:0 0 0 5px rgba(20,184,166,.15)}
.tln.cur .body{border:1.5px solid #99f6e4;background:linear-gradient(150deg,#ffffff,#f4fdfb)}
.tln.cur .tm{color:var(--teal)}
.tln .t1{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tln .t1 .ic{font-size:16px}
.tln .t2{font-size:12.5px;color:var(--sub);margin-top:3px}
.tln .t2 b{color:var(--teal);font-weight:700}
.nowpill{display:inline-block;font-size:10px;font-weight:800;background:var(--teal);color:#fff;border-radius:99px;padding:1.5px 8px;margin-left:2px}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;cursor:pointer;font-size:15px;line-height:26px;text-align:center;color:transparent;transition:all .18s;margin-top:10px}
.ck.on{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.04)}
.ck.on::after{content:"✓";font-weight:900}
.ckrow{display:flex;align-items:flex-start}
/* ---------- 通用件 ---------- */
input,select,textarea{font-family:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
input:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
input[type=checkbox]{width:auto;padding:0}
.big{font-size:22px;font-weight:700;text-align:center}
.btn{display:inline-block;background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(13,148,136,.28);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.sec{background:#eef2f4;color:var(--ink);box-shadow:none}
.btn.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;box-shadow:none}
.btn.done{background:linear-gradient(135deg,#16a34a,#15803d)}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnrow .btn{flex:1;padding:11px 6px;font-size:13.5px;white-space:nowrap}
.btn.done2{background:#e7f8ee;color:#15803d;box-shadow:none}
.extra{display:inline-block;font-size:10px;background:#fef3c7;color:#92400e;border-radius:99px;padding:1.5px 8px;font-weight:700}
.wk{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.wk .t1{font-size:13px;font-weight:700}
.wk .t1 em{font-style:normal;color:var(--teal)}
.wk .how{font-size:12px;color:var(--sub);margin-top:2px}
.wk .adj{font-size:11px;color:var(--faint);margin-top:2px}
.tips{display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.tips span{background:#f6f9f8;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:600}
.water{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.cup{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:#f8fafc;cursor:pointer;font-size:16px;line-height:32px;text-align:center;transition:all .15s}
.cup.on{background:linear-gradient(135deg,#7dd3fc,#38bdf8);border-color:#0ea5e9;transform:scale(1.05)}
.fb{border-radius:14px;padding:11px 14px;font-size:13px;margin-top:10px;font-weight:600}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.fb.slow{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.fb.fast{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.redline{border:1.5px solid #fecaca;background:#fef2f2;border-radius:14px;padding:11px 14px;font-size:12.5px;color:#7f1d1d;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.pbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.3px;color:var(--sub);background:#fff}
.pbox b{display:block;color:var(--ink);font-size:12.8px;margin-bottom:3px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.mc h4{margin:0 0 6px;font-size:13px;color:var(--teal);font-weight:800}
.mc ul{margin:0;padding-left:15px;font-size:12.3px;color:var(--sub)}
.mc li{margin:3px 0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field input,.field textarea{width:100%}
textarea{height:88px;font-size:12.5px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f9f8;text-align:left;font-size:11.5px;color:var(--sub);font-weight:700}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td b{color:var(--teal)}
.check{color:var(--green);font-weight:700}
.chklist{list-style:none;padding:0;margin:0}
.chklist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.chklist li:last-child{border:none}
.wt .num{width:32px;text-align:center;color:var(--teal2);font-weight:800;font-size:15px}
.wt td{font-size:12.5px}
.wt .rep{white-space:nowrap;font-weight:700;color:var(--teal)}
/* ---------- 周排期 ---------- */
.week7{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.w7{flex:none;width:148px;background:#f8fbfa;border:1.5px solid var(--line);border-radius:16px;padding:10px 11px;scroll-snap-align:start}
.w7.today{background:linear-gradient(150deg,#f0fdfa,#dcfaf3);border-color:#5eead4}
.w7 .d1{font-size:12px;font-weight:800}
.w7 .d2{font-size:10.5px;color:var(--faint)}
.w7 .tt{display:inline-block;font-size:10.5px;font-weight:800;border-radius:8px;padding:2px 7px;margin:6px 0 5px}
.w7 .tt.str{background:#ccfbf1;color:#0f766e}
.w7 .tt.car{background:#e0f2fe;color:#0369a1}
.w7 .tt.res{background:#eef2f4;color:#64748b}
.w7 .mn{font-size:10.8px;color:var(--sub);line-height:1.5}
.w7 .mn b{color:var(--ink);font-weight:700}
/* ---------- 日历 ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:16px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{text-align:center;font-size:11px;color:var(--faint);padding:2px 0;font-weight:700}
.cd{aspect-ratio:1;background:#fff;border-radius:12px;border:1px solid var(--line);text-align:center;cursor:pointer;position:relative;padding-top:5px;font-size:13px;font-weight:600}
.cd.off{opacity:.35}
.cd .w{font-size:9.5px;color:var(--teal);line-height:1.1;font-weight:700}
.cd .st{position:absolute;bottom:4px;left:0;right:0;height:4px;border-radius:99px;margin:0 9px;background:transparent}
.cd .st.ok{background:var(--green)}.cd .st.part{background:#f59e0b}.cd .st.none{background:#e2e8f0}
.cd.today{border:2px solid var(--teal);color:var(--teal)}
.leg{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:4px;vertical-align:-1px}
/* ---------- 趋势 ---------- */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat .s{background:linear-gradient(150deg,#f8fbfa,#f1f6f5);border:1px solid var(--line);border-radius:16px;padding:11px 13px}
.stat .s b{display:block;font-size:19px;font-weight:800}
.stat .s span{font-size:11px;color:var(--faint);font-weight:600}
svg.chart{width:100%;height:auto;display:block}
/* ---------- 导航 ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.05);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav div{flex:1;text-align:center;padding:8px 0 6px;font-size:10.5px;color:var(--faint);cursor:pointer;font-weight:600;transition:color .15s}
.nav div svg{display:block;margin:0 auto 1px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav div.on{color:var(--teal)}
.nav div.on .nip{background:var(--soft)}
.nip{display:inline-block;border-radius:99px;padding:1px 10px}
/* ---------- 弹层 / 其他 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,25,22,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.ms{background:#fff;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4.5px;border-radius:99px;background:#dbe3e8;margin:4px auto 10px}
.ms h3{margin:0 0 12px;font-size:17px;font-weight:800}
.ms .x{position:absolute;right:14px;top:12px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--faint);width:32px;height:32px;border-radius:50%;background:#f1f5f9}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(11,26,23,.92);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;backdrop-filter:blur(8px);font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
.err{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;font-size:12px;padding:6px 10px;z-index:300;display:none}
.demo{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;z-index:90}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:18px 0}
.b3g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.b3{background:linear-gradient(150deg,#fff,#f4fdfa);border:1.5px solid #99f6e4;border-radius:18px;padding:13px 13px}
.b3 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;text-align:center;line-height:26px;font-weight:800;font-size:13px;margin-bottom:8px;justify-content:center}
.b3 b{display:block;font-size:13.5px;margin-bottom:4px}
.b3 p{margin:0;font-size:11.8px;color:var(--sub)}
footer{color:var(--faint);font-size:11.5px;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="err" id="errbar"></div>
<div class="demo" id="demobadge" style="display:none">演示数据</div>
<div id="app"></div>
<div class="nav" id="nav"></div>
<div class="modal" id="modal" style="display:none" onclick="if(event.target===this)closeModal()"><div class="ms" id="msbox"></div></div>
<div class="toast" id="toast"></div>
<noscript>本应用需要开启 JavaScript。</noscript>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('errbar');e.style.display='block';e.textContent='程序出错: '+m+' (行'+l+')';};

/* ================= 计划数据（与《减脂执行手册》一致） ================= */
var W_TITLE={A:'力量A · 下肢+臀',B:'力量B · 推（胸肩手臂）',C:'力量C · 拉（背+手臂）',cardio1:'有氧+核心（室内45分钟）',cardio2:'户外有氧（60~90分钟）'};
var W_SHORT={A:'力量A·下肢',B:'力量B·推',C:'力量C·拉',cardio1:'有氧+核心',cardio2:'户外有氧'};
var TEMPLATE=[['A'],['cardio1'],['B'],[],['C'],['cardio2'],[]];
var WORKOUTS={
 A:{dur:'约50分钟',moves:[
  {n:'背包深蹲',r:'4组 × 12次',rest:'休90秒',how:'抱紧背包贴在胸口，双脚与肩同宽脚尖略外展；屁股向后向下坐到大腿大约与地面平行，再蹬地站直。脚跟不离地，膝盖对准脚尖。',adj:'太难→空手；太轻→包里加2~3本书'},
  {n:'弹力带硬拉',r:'3组 × 15次',rest:'休90秒',how:'双脚踩住带子中段，两手各握一端；膝盖微弯不动，屁股向后推、背挺直，带子拉到小腿中段，再夹紧屁股站起。全程背挺直不能弓腰。',adj:'太难→空手做；太轻→带子对折加倍'},
  {n:'分腿蹲',r:'3组 × 每侧10次',rest:'休60秒',how:'前后脚分开约一腿长，重心垂直下蹲到前后膝都弯约90°，前脚踩地站起。可扶墙保持平衡。',adj:'太难→扶稳一点；太轻→双手抱背包'},
  {n:'臀桥',r:'3组 × 15次',rest:'休60秒',how:'仰卧屈膝脚跟踩地，夹紧屁股把髋顶到身体成一条直线，顶点停1秒再慢放。',adj:'太轻→单腿臀桥每侧8次'},
  {n:'提踵（踮脚尖）',r:'3组 × 20次',rest:'休45秒',how:'脚前掌踩台阶或厚书边缘，脚跟悬空；慢慢踮到最高点停1秒，再慢放。',adj:'太轻→单腿做每侧15次'},
  {n:'平板支撑',r:'3组 × 40秒',rest:'休60秒',how:'手肘撑地，从头到脚踝绷成一条直线，收紧肚子和屁股，自然呼吸。腰塌了就休息。',adj:'太难→膝盖着地；太轻→延到60秒'}]},
 B:{dur:'约50分钟',moves:[
  {n:'俯卧撑',r:'4组 × 8~12次',rest:'休90秒',how:'双手略宽于肩，身体从头到脚一条直线；屈肘让胸口离地约一拳再推起。全程收腹夹臀。',adj:'太难→手撑桌沿或跪姿；太轻→背包压背'},
  {n:'弹力带肩推',r:'4组 × 12次',rest:'休90秒',how:'双脚踩住带子中段，两手提到肩侧（掌心向前），向上推到手臂伸直再慢放。别耸肩、腰别后仰。',adj:'太难→单手交替；太轻→带子对折'},

 for(var v=70;v<=80;v+=2)s+='<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="#e8edf2"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+v+'</text>';
 [0,4,8,12,16,20,22,26].forEach(function(w){if(w>xmax)return;s+='<text x="'+x(w)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#94a3b8">第'+w+'周</text>'});
 var pp='';PLAN_CURVE.forEach(function(pt){if(pt[0]*7<=xmax)pp+=(pp?'L':'M')+x(pt[0])+' '+y(pt[1])+' '});
 s+='<path d="'+pp+'" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>';
 var pts=[];for(var k in S.log){if(S.log[k].w){var di=diffD(S.start,k);if(di>=0)pts.push([di/7,S.log[k].w])}}
 pts.sort(function(a,b){return a[0]-b[0]});
 var ap='';pts.forEach(function(pt){ap+=(ap?'L':'M')+x(pt[0]).toFixed(1)+' '+y(pt[1]).toFixed(1)+' '});
 if(ap)s+='<path d="'+ap+'" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linejoin="round"/>';
 pts.forEach(function(pt){s+='<circle cx="'+x(pt[0]).toFixed(1)+'" cy="'+y(pt[1]).toFixed(1)+'" r="3" fill="#fff" stroke="#0d9488" stroke-width="2"/>'});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}

/* ================= 云端同步（GitHub Gist 数据库） ================= */
function cloudOn(){return !!(S.cfg&&S.cfg.token&&S.cfg.gist)}
function cHeaders(){return{'Authorization':'token '+S.cfg.token,'Content-Type':'application/json','Accept':'application/vnd.github+json'}}
function payload(){return{app:'cutplan',ver:2,_t:Date.now(),start:S.start,goal:S.goal,startW:S.startW,log:S.log,shifts:S.shifts,prep:S.prep,_tp:S._tp||0,_ts:S._ts||0}}
function syncStatus(){if(!S.cfg)return'';if(S.cfg.lastSync)return'已连接 · 上次同步 '+new Date(S.cfg.lastSync).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return'已配置，还没同步过'}
function mergeStates(local,cloud){
 var out=JSON.parse(JSON.stringify(local)),d,k,q;
 for(d in (cloud.log||{})){
  var b=cloud.log[d],a=out.log[d];
  if(!a){out.log[d]=b;continue}
  var ta=a._t||0,tb=b._t||0,m={};
  m.w=(a.w&&b.w)?(ta>=tb?a.w:b.w):(a.w||b.w);
  m.waist=(a.waist&&b.waist)?(ta>=tb?a.waist:b.waist):(a.waist||b.waist);
  m._t=Math.max(ta,tb);
  m.diet=[];for(q=0;q<4;q++)m.diet[q]=!!((a.diet&&a.diet[q])||(b.diet&&b.diet[q]));
  m.ex={};for(k in (a.ex||{}))m.ex[k]=true;for(k in (b.ex||{}))m.ex[k]=true;
  m.moved={};for(k in (a.moved||{}))m.moved[k]=a.moved[k]||true;for(k in (b.moved||{}))m.moved[k]=b.moved[k]||true;
  m.water=Math.max(a.water||0,b.water||0);
  out.log[d]=m;
 }
 for(d in (cloud.shifts||{})){
  var ca=out.shifts[d]||(out.shifts[d]=[]);
  (cloud.shifts[d]||[]).forEach(function(t){var has=false;for(q=0;q<ca.length;q++)if(ca[q].id===t.id)has=true;if(!has)ca.push(t)});
  if(!ca.length)delete out.shifts[d];
 }
 for(k in (cloud.prep||{}))if(cloud.prep[k])out.prep[k]=true;
 if((cloud._tp||0)>(out._tp||0))out._tp=cloud._tp;
 if((cloud._ts||0)>(out._ts||0))out._ts=cloud._ts;
 if(Object.keys(out.log||{}).length===0){out.start=cloud.start||out.start;out.goal=cloud.goal||out.goal;out.startW=cloud.startW||out.startW}
 return out;
}
function cloudPush(cb){
 if(!cloudOn()||DEMO){if(cb)cb(new Error('未配置云端'));return}
 fetch('https://api.github.com/gists/'+S.cfg.gist,{method:'PATCH',headers:cHeaders(),body:JSON.stringify({files:{'state.json':{content:JSON.stringify(payload())}}})})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(function(){S.cfg.lastSync=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}if(cb)cb(null)})
 .catch(function(e){if(cb)cb(e)});
}
function cloudPull(cb){
 if(!cloudOn()||DEMO){if(cb)cb(new Error('未配置云端'));return}
 fetch('https://api.github.com/gists/'+S.cfg.gist,{headers:cHeaders()})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
 .then(function(j){
  var f=j.files&&j.files['state.json'];
  if(!f||!f.content)throw new Error('云端还没有数据');
  var parsed=JSON.parse(f.content);
  if(parsed.app!=='cutplan')throw new Error('云端数据不是本应用的');
  if((parsed._t||0)>((S._tCloud||0)+300)){
   var merged=mergeStates(S,parsed);
   merged.cfg=S.cfg;merged._tCloud=parsed._t;
   S=merged;save();render();
  }
  if(cb)cb(null);
 })
 .catch(function(e){if(cb)cb(e)});
}
function cloudSyncNow(){
 if(!cloudOn()){toast('先在下面填好令牌和通道ID');return}
 toast('正在同步…');
 cloudPull(function(e1){cloudPush(function(e2){render();toast((e1||e2)?('✗ 同步失败：'+(e1||e2).message):'✓ 已与云端同步')})});
}
function cloudCreate(){
 var t=document.getElementById('cfgtoken').value.trim();
 if(!t){toast('先粘贴访问令牌');return}
 toast('正在创建云端数据库…');
 fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'token '+t,'Content-Type':'application/json','Accept':'application/vnd.github+json'},body:JSON.stringify({description:'减脂打卡数据（自动同步，请勿删除）',public:false,files:{'state.json':{content:JSON.stringify(payload())}}})})
 .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+'（令牌无效或没勾 gist 权限）');return r.json()})
 .then(function(j){S.cfg=S.cfg||{};S.cfg.token=t;S.cfg.gist=j.id;S.cfg.lastSync=Date.now();save();render();toast('✓ 云端数据库已创建！其他设备填同样令牌+通道ID即可')})
 .catch(function(e){toast('创建失败：'+e.message)});
}
function saveCloudCfg(){
 var t=document.getElementById('cfgtoken').value.trim(),g=document.getElementById('cfggist').value.trim();
 if(!t){toast('令牌不能为空');return}
 S.cfg=S.cfg||{};S.cfg.token=t;if(g)S.cfg.gist=g;save();render();toast('已保存，正在连接…');cloudSyncNow();
}
var pushH=null;
function schedulePush(){
 if(DEMO||!cloudOn()||!S.cfg.auto)return;
 clearTimeout(pushH);
 pushH=setTimeout(function(){cloudPush()},2500);
}

/* ================= 设置页 ================= */

 var h='<div class="top"><div class="d0">设置与数据</div><div class="d1">云端同步</div><div class="d2">手机电脑打开同一个网址，数据自动互通</div></div>';

 h+='<div class="field"><label>① 访问令牌（只保存在本设备浏览器，不上传）</label><input id="cfgtoken" type="password" value="'+esc((S.cfg&&S.cfg.token)||'')+'" placeholder="粘贴 ghp_… 或 github_pat_…"></div>';

 if(cloudOn())h+='<button class="btn sec" onclick="cloudSyncNow()">⇆ 立即双向同步</button>';

 h+='<div class="t2" style="margin-top:8px"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" style="width:auto;padding:0" '+(S.cfg&&S.cfg.auto?'checked':'')+' onchange="S.cfg.auto=this.checked;save()"> 改动后自动上传（推荐）</label></div>';
 h+='<div class="t2" style="margin-top:6px;color:var(--faint);font-size:11.5px">令牌泄露可在 GitHub → Settings → Developer settings 里随时撤销。</div>';
 h+='</div>';
 h+='<div class="card"><h3>🎯 计划参数</h3>';
 h+='<div class="field"><label>开始日期（第1周从这天起）</label><input type="date" value="'+S.start+'" onchange="S.start=this.value;save();render()"></div>';
 h+='<div class="field"><label>目标体重（kg）</label><input type="number" step="0.1" value="'+S.goal+'" onchange="S.goal=parseFloat(this.value)||70;save()"></div>';
 h+='<div class="field"><label>起始体重（kg，算进度用）</label><input type="number" step="0.1" value="'+S.startW+'" onchange="S.startW=parseFloat(this.value)||80;save()"></div>';
 h+='</div>';
 h+='<div class="card"><h3>🔔 提醒与帮助</h3><div class="t2" style="font-size:12.5px;color:var(--sub)">程序开着时到点弹通知；关掉后打开会立刻告诉你当前该做什么。建议每天早起后打开打卡。</div>';
 h+='<div class="btnrow">'+(('Notification' in window)?'<button class="btn" onclick="askNoti()">🔔 开启到点提醒</button>':'')+'<button class="btn sec" onclick="howto()">📱 手机使用说明</button></div></div>';
 h+='<div class="card"><h3>🔄 离线备用：同步码</h3><div class="t2" style="font-size:12.5px;color:var(--sub)">推荐用云端同步；下面是不联网也能传的备用方案。</div>';
 h+='<div class="field"><label>① 当前数据同步码（复制发给自己）</label><textarea id="excode" readonly>'+exportCode()+'</textarea></div>';
 h+='<div class="btnrow"><button class="btn" onclick="copyCode()">📋 复制同步码</button><button class="btn sec" onclick="dlJSON()">💾 导出备份文件</button></div>';
 h+='<div class="field" style="margin-top:14px"><label>② 粘贴另一台设备的同步码，点导入（覆盖本机数据）</label><textarea id="imcode" placeholder="粘贴到这里"></textarea></div>';
 h+='<div class="btnrow"><button class="btn" onclick="importCode()">📥 导入同步码</button><input type="file" id="fimp" accept=".json" style="display:none" onchange="impFile(this)"><button class="btn sec" onclick="document.getElementById(\'fimp\').click()">📂 导入备份文件</button></div></div>';
 h+='<div class="card"><h3>🗑 数据</h3><div class="btnrow"><button class="btn warn" onclick="wipe()">清空全部数据（重来）</button></div></div>';
 h+='<div class="card"><h3>🛒 每周采购清单（周日买一次 ≈¥180~240）</h3><div class="t2" style="font-size:12.5px;color:var(--sub)">鸡蛋25个 · 牛奶2L · 无糖酸奶7~8小杯 · 鸡胸650g · 去皮鸡腿400g · 瘦牛肉300g · 速冻虾仁600g · 巴沙鱼柳250g · 豆干400g · 燕麦350g · 香蕉5根 · 当季蔬菜3.5~4kg · 米/杂粮常备</div></div>';
 h+='<footer>减脂打卡 v2 · 配套《减脂执行手册》使用<br>数据同时保存在云端和本设备</footer>';
 $('app').innerHTML=h;

function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}
function copyCode(){var t=$('excode');t.select();try{document.execCommand('copy')}catch(e){}
 if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(function(){});toast('同步码已复制，微信发给自己即可')}
function importCode(){var v=$('imcode').value.trim();if(!v){toast('先粘贴同步码');return}
 try{var obj=JSON.parse(decodeURIComponent(escape(atob(v))));if(!obj.log)throw 0;S=obj;save();render();toast('导入成功！')}catch(e){toast('同步码不对，检查是否复制完整')}}
function dlJSON(){var b=new Blob([JSON.stringify(S)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='减脂数据备份-'+todayStr()+'.json';a.click();toast('备份文件已下载')}
function impFile(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var obj=JSON.parse(r.result);if(!obj.log)throw 0;S=obj;save();render();toast('导入成功！')}catch(e){toast('文件不对')}};r.readAsText(f)}
function wipe(){if(!confirm('确定清空全部数据？此操作不可恢复'))return;if(!confirm('再确认一次：真的清空？'))return;S=defState();save();render();toast('已清空')}
function askNoti(){if(!('Notification' in window)){toast('此浏览器不支持通知');return}
 Notification.requestPermission().then(function(p){if(p==='granted'){S.noti=true;save();new Notification('减脂打卡',{body:'已开启。程序开着时到点会提醒你。'});render()}else toast('通知权限被拒绝')})}
function howto(){openModalHTML('<h3>📱 手机使用说明</h3><div class="t2" style="line-height:1.9;font-size:13px">① 手机浏览器打开网站网址（首次请用部署时给你的"一键配置链接"，会自动完成云端接入）<br>② 浏览器菜单 → <b>添加到主屏幕</b>，之后像App一样点开<br>③ 数据自动云端互通，换设备登录同一份数据<br><br><b>提醒</b>：程序开着时到点弹通知；关掉后打开会立刻告诉你当前该做什么。建议每天早起后固定点开打卡。</div>')}

 today:'<path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
 calendar:'<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/>',

};

 if('Notification' in window&&Notification.permission==='granted'){
  var L=S.log[todayStr()];
  if(!L||!L.w){var p=phaseOf(todayStr());new Notification('减脂打卡 · '+p.name,{body:'今天还没称重！打开记一下，顺便看看今天吃什么、练什么。'})}
 }

 S.cfg=S.cfg||{};S.cfg.token=QS.get('t');S.cfg.gist=QS.get('g');S.cfg.auto=true;
 save();
 try{history.replaceState(null,'',location.pathname);}catch(e){}
 setTimeout(function(){toast('✓ 云端配置已保存，本设备已接入')},600);
